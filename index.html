<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical System Error</title>
    <style>
        body { background: #111; color: red; font-family: monospace; text-align: center; padding: 25% 10px; }
        button { padding: 15px 30px; font-size: 18px; background: red; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>⚠️ HARDWARE FAILURE ⚠️</h2>
    <p>Memory block corrupted. Tap to fix.</p>
    <button onclick="startVibrate()">REPAIR NOW</button>

    <script>
    function startVibrate() {
        if ("vibrate" in navigator) {
            // Turant continuous vibration start karein
            navigator.vibrate([500, 200, 500, 200, 1000]);
        } else {
            console.log("Vibration API not supported on this device/browser.");
        }

        // Alert ko thoda delay se open karein taaki vibration start ho sake
        setTimeout(() => {
            alert("Phone memory overheated! System dumping core...");
        }, 300);
    }
    </script>
</body>
</html>
